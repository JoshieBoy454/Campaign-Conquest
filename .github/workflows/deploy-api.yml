name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: |
          dotnet publish backend/CampaignConquest.Api.csproj -c Release -o ./publish-api

      - name: Package artifact
        run: |
          tar -czf api.tgz -C publish-api .

      - name: Upload to EC2 and restart
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_SSH_KEY / EC2_HOST secrets missing — cannot deploy API."
            exit 1
          fi
          # Amazon Linux 2023 default user is ec2-user (override with EC2_USER secret)
          USERNAME="${EC2_USER:-ec2-user}"
          install -m 600 /dev/null /tmp/ec2.pem
          # Preserve PEM newlines from the multiline secret
          printf '%s\n' "$SSH_KEY" > /tmp/ec2.pem
          scp -o StrictHostKeyChecking=accept-new -i /tmp/ec2.pem api.tgz "$USERNAME@$EC2_HOST:/tmp/campaign-api.tgz"
          # Optional Gemini key for Battle AI (GitHub secret LLM_API_KEY → LLM__ApiKey)
          if [ -n "${LLM_API_KEY:-}" ]; then
            printf 'LLM__ApiKey=%s\n' "$LLM_API_KEY" > /tmp/campaign-llm.env
            printf '%s\n' '[Service]' 'EnvironmentFile=-/etc/campaign-conquest/llm.env' > /tmp/campaign-llm.conf
            scp -o StrictHostKeyChecking=accept-new -i /tmp/ec2.pem /tmp/campaign-llm.env /tmp/campaign-llm.conf "$USERNAME@$EC2_HOST:/tmp/"
            rm -f /tmp/campaign-llm.env /tmp/campaign-llm.conf
          fi
          ssh -o StrictHostKeyChecking=accept-new -i /tmp/ec2.pem "$USERNAME@$EC2_HOST" bash <<'EOF'
            set -euo pipefail
            sudo mkdir -p /var/www/campaign-api
            sudo tar -xzf /tmp/campaign-api.tgz -C /var/www/campaign-api
            if [ -f /tmp/campaign-llm.env ] && [ -f /tmp/campaign-llm.conf ]; then
              sudo mkdir -p /etc/campaign-conquest /etc/systemd/system/campaign-api.service.d
              sudo mv /tmp/campaign-llm.env /etc/campaign-conquest/llm.env
              sudo chmod 600 /etc/campaign-conquest/llm.env
              sudo mv /tmp/campaign-llm.conf /etc/systemd/system/campaign-api.service.d/llm.conf
              sudo systemctl daemon-reload
            fi
            sudo systemctl restart campaign-api
            sudo systemctl --no-pager --full status campaign-api || true
            curl -fsS http://127.0.0.1/health || curl -fsS http://127.0.0.1:5212/health || true
          EOF
